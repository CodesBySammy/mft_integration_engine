spring:
  application:
    name: mft-integration-engine
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${MFT_DB_URL:jdbc:h2:file:./workspace/db/mft_database;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;MODE=MySQL}
    driver-class-name: ${MFT_DB_DRIVER:org.h2.Driver}
    username: ${MFT_DB_USER:sa}
    password: ${MFT_DB_PASSWORD:}
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.mft.integration: DEBUG
    org.apache.sshd: INFO
    org.springframework.integration: INFO

mft:
  scheduling:
    enabled: true
    fixed-delay-ms: 5000

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    enabled: true
