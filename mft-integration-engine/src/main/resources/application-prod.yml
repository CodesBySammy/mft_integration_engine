# ==============================================================================
# Production Profile: Enterprise MFT-to-MFT (e.g. IBM Sterling B2Bi / File Gateway)
# ==============================================================================
# Activate with: java -jar mft-integration-engine.jar --spring.profiles.active=prod
# Sensitive credentials are injected via environment variables or secret vaults.

mft:
  scheduling:
    enabled: ${MFT_SCHEDULING_ENABLED:true}
    fixed-delay-ms: ${MFT_SCHEDULING_DELAY_MS:10000}

  connections:
    # --------------------------------------------------------------------------
    # SOURCE MFT: IBM Sterling SFTP Server Adapter / Gateway
    # --------------------------------------------------------------------------
    C_IBM_SOURCE:
      connection-id: C_IBM_SOURCE
      connection-type: SFTP
      host: ${IBM_SOURCE_MFT_HOST:ibm-mft-source.corp.internal}
      port: ${IBM_SOURCE_MFT_PORT:10022}
      username: ${IBM_SOURCE_MFT_USER:mft_bridge_in}
      authentication-type: ${IBM_SOURCE_AUTH_TYPE:PRIVATE_KEY}
      password: ${IBM_SOURCE_MFT_PASSWORD:}
      password-secret-ref: IBM_SOURCE_MFT_PASSWORD
      private-key-path: ${IBM_SOURCE_KEY_PATH:config/keys/ibm_source_rsa.pem}
      private-key-passphrase: ${IBM_SOURCE_KEY_PASSPHRASE:}
      remote-base-directory: ${IBM_SOURCE_BASE_DIR:/}
      host-key-verification-mode: ${IBM_SOURCE_HOST_KEY_MODE:STRICT_KNOWN_HOSTS}
      known-hosts-file: ${IBM_SOURCE_KNOWN_HOSTS:config/keys/known_hosts}
      connection-timeout-ms: 30000
      session-timeout-ms: 60000
      enabled: true

    # --------------------------------------------------------------------------
    # DESTINATION MFT: IBM Sterling SFTP Server Adapter / Gateway
    # --------------------------------------------------------------------------
    C_IBM_DEST:
      connection-id: C_IBM_DEST
      connection-type: SFTP
      host: ${IBM_DEST_MFT_HOST:ibm-mft-dest.corp.internal}
      port: ${IBM_DEST_MFT_PORT:10022}
      username: ${IBM_DEST_MFT_USER:mft_bridge_out}
      authentication-type: ${IBM_DEST_AUTH_TYPE:PRIVATE_KEY}
      password: ${IBM_DEST_MFT_PASSWORD:}
      password-secret-ref: IBM_DEST_MFT_PASSWORD
      private-key-path: ${IBM_DEST_KEY_PATH:config/keys/ibm_dest_rsa.pem}
      private-key-passphrase: ${IBM_DEST_KEY_PASSPHRASE:}
      remote-base-directory: ${IBM_DEST_BASE_DIR:/}
      host-key-verification-mode: ${IBM_DEST_HOST_KEY_MODE:STRICT_KNOWN_HOSTS}
      known-hosts-file: ${IBM_DEST_KNOWN_HOSTS:config/keys/known_hosts}
      connection-timeout-ms: 30000
      session-timeout-ms: 60000
      enabled: true

  routes:
    # --------------------------------------------------------------------------
    # Route 1: RAW_COPY (Binary / Exact Pass-Through with SHA-256 Deduplication)
    # --------------------------------------------------------------------------
    R_IBM_RAW_COPY:
      route-id: R_IBM_RAW_COPY
      source-connection-id: C_IBM_SOURCE
      destination-connection-id: C_IBM_DEST
      processing-mode: RAW_COPY
      source-directory: ${IBM_SOURCE_RAW_DIR:/Mailbox/PartnerA/upload}
      source-pattern: "*.txt"
      destination-directory: ${IBM_DEST_RAW_DIR:/Mailbox/CoreBanking/incoming}
      checksum-algorithm: SHA_256
      retry-limit: 3
      allow-reprocessing: false
      enabled: true

    # --------------------------------------------------------------------------
    # Route 2: TRANSFORM (Fixed-Width Banking -> Delimited CSV + Manifests)
    # --------------------------------------------------------------------------
    R_IBM_TRANSFORM:
      route-id: R_IBM_TRANSFORM
      source-connection-id: C_IBM_SOURCE
      destination-connection-id: C_IBM_DEST
      processing-mode: TRANSFORM
      source-directory: ${IBM_SOURCE_TRANSFORM_DIR:/Mailbox/PartnerA/upload}
      source-pattern: "*.dat"
      destination-directory: ${IBM_DEST_TRANSFORM_DIR:/Mailbox/CoreBanking/incoming}
      checksum-algorithm: SHA_256
      retry-limit: 3
      allow-reprocessing: false
      enabled: true
